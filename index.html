<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trening</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lock" class="lock">
  <form id="lock-form" class="lock-box">
    <svg viewBox="0 0 24 24" class="lock-mark" aria-hidden="true"><path d="M3.4 19.5 6.8 9l6-5 7 5.6 1 9.9Z"/><circle class="dot" cx="10.6" cy="10.2" r="1.2"/><circle class="dot" cx="14.6" cy="13.2" r="1.2"/><circle class="dot" cx="9.4" cy="15.4" r="1.2"/></svg>
    <h1>Trening</h1>
    <label>Passord
      <input id="lock-pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label class="check"><input id="lock-remember" type="checkbox" checked> Husk på denne enheten</label>
    <button class="btn" id="lock-go">Åpne</button>
    <p id="lock-msg" class="msg" role="alert"></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <main id="view"></main>
  <nav class="tabs" aria-label="Hovedmeny">
    <button data-tab="logg"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M4 10h16M8.5 3v3.5M15.5 3v3.5"/><path d="m9 15 2 2 4-4"/></svg>Logg</button>
    <button data-tab="oversikt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c2.5-.5 3.5-3.5 5.5-5s3.5-.5 5-2.5 2-4.5 5.5-6.5"/><circle cx="9.5" cy="14" r="1.5"/><circle cx="14.5" cy="11.5" r="1.5"/><circle cx="20" cy="5" r="1.5"/></svg>Utvikling</button>
    <button data-tab="mer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h9M18 7.5h2M4 16.5h2M11 16.5h9"/><circle cx="15.5" cy="7.5" r="2.2"/><circle cx="8.5" cy="16.5" r="2.2"/></svg>Mer</button>
  </nav>
</div>

<div id="sheet" class="sheet" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" hidden><span id="toast-txt"></span><button id="toast-undo">Angre</button></div>
<script type="module" src="app.js"></script>
</body>
</html>
